<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI의 그림자 — 정답이 0원이 된 교실</title>
<meta name="description" content="AIEDAP 마스터교원 신규연수 강의 슬라이드">
<style>
  :root { --bg:#111418; --fg:#e8eaed; --muted:#9aa0a6; --accent:#f0a020; --panel:#1b1f24; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif; overflow:hidden; }
  #stage { position:fixed; inset:0 0 56px 0; display:flex; align-items:center; justify-content:center; touch-action:pan-y; user-select:none; }
  #frame { position:relative; width:min(100vw, calc((100vh - 56px) * 16 / 9)); aspect-ratio:16/9; box-shadow:0 6px 30px rgba(0,0,0,.5); }
  #slide { width:100%; height:100%; display:block; }
  #links { position:absolute; inset:0; z-index:2; pointer-events:none; }
  #links a { position:absolute; pointer-events:auto; cursor:pointer; border-radius:3px; }
  #links a:hover, #links a:focus-visible { background:rgba(240,160,32,.22); outline:2px solid var(--accent); }
  /* 그림에 찍힌 옛 번호(실제 순서보다 1 큼)를 배경색으로 덮고, 현재 순서 번호를 같은 서식으로 다시 그림 */
  #pnum { position:absolute; left:88.889%; top:94.321%; width:6.111%; height:4.444%; z-index:1; display:none; align-items:center; justify-content:flex-end;
    font:700 1.25cqw/1 "Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif; pointer-events:none; }
  #frame { container-type:inline-size; z-index:2; cursor:pointer; }
  .endpage { position:absolute; inset:0; z-index:3; display:none; background:linear-gradient(#e7e7e7 52%, #9fc5e8 52%);
    font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif; color:#1a1a1a; }
  .endpage.show { display:block; }
  .endpage .top { position:absolute; left:4.8cqw; top:2.4cqw; font-size:1.25cqw; font-weight:700; color:#0b4a9e; }
  .endpage .card { position:absolute; left:4.3cqw; right:4.3cqw; top:4.9cqw; bottom:3.6cqw; background:#fff; border-radius:1.6cqw; padding:2.6cqw 3.6cqw; }
  .endpage h2 { margin:0; font-size:2.6cqw; }
  .endpage h2 span { color:#0b4a9e; }
  .endpage .rule { width:5.6cqw; height:.3cqw; background:#f0a020; margin:1.4cqw 0 2.4cqw; }
  .endpage ul { list-style:none; margin:0; padding:0; display:grid; grid-template-columns:1fr 1fr; gap:1.1cqw 3cqw; grid-auto-flow:column; grid-template-rows:repeat(6,auto); }
  .endpage li { display:flex; align-items:baseline; gap:1cqw; font-size:1.55cqw; border-bottom:1px solid #eee; padding-bottom:.9cqw; }
  .endpage li b { flex:0 0 15.5cqw; color:#333; font-weight:700; }
  .endpage li b small { display:block; white-space:nowrap; font-size:1cqw; font-weight:400; color:#777; margin-top:.2cqw; }
  .endpage a { color:#0b4a9e; text-decoration:none; word-break:break-all; }
  .endpage a:hover { text-decoration:underline; }
  .endpage a + a::before { content:"· "; color:#999; }
  .endpage .more { margin-top:2.6cqw; font-size:1.8cqw; background:#fff4e0; border-radius:.8cqw; padding:1cqw 1.6cqw; }
  .endpage .more a { font-weight:700; }
  .endpage .foot { position:absolute; right:4.9cqw; bottom:1cqw; font-size:1.1cqw; font-weight:700; color:#0b4a9e; }
  .endpage.act .actwrap { display:flex; align-items:center; justify-content:space-between; gap:4cqw; height:100%; }
  .endpage.act .eyebrow { margin:0 0 1cqw; font-size:1.4cqw; font-weight:700; color:#f0a020; }
  .endpage.act h2 { font-size:3.6cqw; line-height:1.3; }
  .endpage.act .desc { font-size:1.6cqw; line-height:1.7; color:#444; margin:0 0 2.6cqw; }
  .endpage.act .btn { display:inline-block; background:#0b4a9e; color:#fff; font-size:1.8cqw; font-weight:700; padding:1.2cqw 2.6cqw; border-radius:.8cqw; }
  .endpage.act .btn:hover { background:#083a7d; text-decoration:none; }
  .endpage.act .qrbox { text-align:center; flex:0 0 auto; }
  .endpage.act #qr { width:22cqw; height:22cqw; padding:1cqw; border:1px solid #ddd; border-radius:1cqw; background:#fff; }
  .endpage.act #qr img, .endpage.act #qr canvas { width:100% !important; height:100% !important; }
  .endpage.act .qrbox p { margin:1cqw 0 0; font-size:1.3cqw; color:#666; }
  #grid .endthumb { width:100%; aspect-ratio:16/9; border-radius:4px; background:#fff; color:#0b4a9e; display:flex; align-items:center; justify-content:center; font-weight:700; border:2px solid transparent; }
  #grid figure.current .endthumb { border-color:var(--accent); }
  .nav-zone { position:absolute; top:0; bottom:0; width:30%; cursor:pointer; z-index:1; }
  .nav-zone.left { left:0; } .nav-zone.right { right:0; }
  #bar { position:fixed; left:0; right:0; bottom:0; height:56px; background:var(--panel);
    display:flex; align-items:center; gap:8px; padding:0 16px; }
  #bar button { background:transparent; color:var(--fg); border:1px solid #333a42; border-radius:8px;
    height:36px; min-width:40px; padding:0 10px; font-size:15px; cursor:pointer; }
  #bar button:hover { background:#262b31; }
  #counter { font-variant-numeric:tabular-nums; color:var(--muted); font-size:14px; min-width:72px; text-align:center; }
  #counter input { width:44px; background:transparent; color:var(--fg); border:none; text-align:right; font:inherit; }
  #progress { flex:1; height:4px; background:#2a2f36; border-radius:2px; overflow:hidden; cursor:pointer; }
  #progress div { height:100%; background:var(--accent); width:0; transition:width .2s; }
  #grid { position:fixed; inset:0 0 56px 0; background:var(--bg); overflow-y:auto; padding:16px;
    display:none; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; }
  #grid.open { display:grid; }
  #grid figure { margin:0; cursor:pointer; position:relative; }
  #grid img { width:100%; aspect-ratio:16/9; display:block; border-radius:4px; border:2px solid transparent; background:#222; }
  #grid figure.current img { border-color:var(--accent); }
  #grid figcaption { position:absolute; left:6px; bottom:6px; background:rgba(0,0,0,.65); font-size:12px; padding:1px 6px; border-radius:4px; }
  .hide-sm { }
  @media (max-width:560px) { .hide-sm { display:none; } #bar { padding:0 8px; gap:6px; } }
</style>
</head>
<body>
<div id="stage">
  <div class="nav-zone left" aria-hidden="true"></div>
  <div class="nav-zone right" aria-hidden="true"></div>
  <div id="frame"><img id="slide" alt=""><div id="pnum"></div><div id="links"></div>
    <section class="endpage" id="endApps" aria-label="홈페이지 모음"></section>
    <section class="endpage act" id="endAct" aria-label="활동 시트"></section>
  </div>
</div>
<div id="grid" aria-label="슬라이드 목록"></div>
<div id="bar">
  <button id="prev" title="이전 (←)">‹</button>
  <span id="counter"><input id="num" inputmode="numeric" aria-label="슬라이드 번호"> / <span id="total"></span></span>
  <button id="next" title="다음 (→)">›</button>
  <div id="progress"><div></div></div>
  <button id="gridBtn" title="전체 보기 (G)">▦</button>
  <button id="fsBtn" class="hide-sm" title="전체 화면 (F)">⛶</button>
</div>
<script>
const IMG_COUNT = 123;
const DEFAULT_CONTENT = {hidden:[],deleted:[],rev:{},apps:{titlePre:"제가 만든 ",titleEm:"웹 앱 모음",rows:[],moreLabel:"",moreUrl:""},act:{eyebrow:"",line1:"",line2:"",desc:"",button:"열기 ↗",sheet:"",qrCaption:""}};
let C = DEFAULT_CONTENT, LINKS = [], NUMS = {}, PAGES = [], cur = 1;
const $ = id => document.getElementById(id);
const img = $('slide'), num = $('num'), grid = $('grid'), bar = $('progress').firstElementChild;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe = u => /^https?:\/\//i.test(u) ? u : '#';
const host = u => String(u).replace(/^https?:\/\//i,'').replace(/\/$/,'');
const src = n => `slides/${String(n).padStart(2,'0')}.webp` + (C.rev && C.rev[n] ? `?v=${C.rev[n]}` : '');
const cache = {};
function preload(p){ if(p && p.t==='img' && !cache[p.n]){ cache[p.n]=new Image(); cache[p.n].src=src(p.n); } }

function buildPages(){
  const hidden = new Set([...(C.hidden || []), ...(C.deleted || [])]);   // 숨김 + 삭제 = 건너뜀
  PAGES = [];
  for(let n=1;n<=IMG_COUNT;n++) if(!hidden.has(n)) PAGES.push({t:'img', n});
  PAGES.push({t:'apps'}, {t:'act'});
  $('total').textContent = PAGES.length;
}
function renderEnd(){
  const a = C.apps, t = C.act;
  const top = '<div class="top">AIEDAP 마스터교원 신규연수</div>';
  const pos = i => PAGES.length - 1 + i;
  $('endApps').innerHTML = top + `<div class="card"><h2>${esc(a.titlePre)}<span>${esc(a.titleEm)}</span></h2><div class="rule"></div>
    <ul style="grid-template-rows:repeat(${Math.max(1,Math.ceil((a.rows||[]).length/2))},auto)">${(a.rows||[]).map(r =>
      `<li><b>${esc(r.label)}${r.sub?`<small>${esc(r.sub)}</small>`:''}</b><a href="${esc(safe(r.url))}" target="_blank" rel="noopener">${esc(host(r.url))}</a></li>`).join('')}</ul>
    ${a.moreUrl ? `<div class="more">${esc(a.moreLabel)} <a href="${esc(safe(a.moreUrl))}" target="_blank" rel="noopener">${esc(host(a.moreUrl))}</a></div>` : ''}</div>
    <div class="foot">${pos(0)}</div>`;
  $('endAct').innerHTML = top + `<div class="card"><div class="actwrap"><div>
    <p class="eyebrow">${esc(t.eyebrow)}</p><h2>${esc(t.line1)}<br><span>${esc(t.line2)}</span></h2><div class="rule"></div>
    <p class="desc">${esc(t.desc).replace(/\n/g,'<br>')}</p>
    <a class="btn" href="${esc(safe(t.sheet))}" target="_blank" rel="noopener">${esc(t.button)}</a></div>
    <div class="qrbox"><div id="qr"></div><p>${esc(t.qrCaption)}</p></div></div></div><div class="foot">${pos(1)}</div>`;
  try { new QRCode($('qr'), { text:t.sheet, width:512, height:512, correctLevel:QRCode.CorrectLevel.M }); } catch(e) {}
}
function renderGrid(){
  grid.innerHTML = '';
  PAGES.forEach((p,i) => {
    const f = document.createElement('figure');
    f.innerHTML = p.t==='img'
      ? `<img loading="lazy" src="${src(p.n)}" alt="슬라이드 ${i+1}"><figcaption>${i+1}</figcaption>`
      : `<div class="endthumb">${p.t==='apps'?'웹 앱 모음':'AI 윤리 원칙 세우기'}</div><figcaption>${i+1}</figcaption>`;
    f.onclick = () => { go(i+1); toggleGrid(false); };
    grid.appendChild(f);
  });
}
function renderLinks(){
  const box = $('links'); box.innerHTML = '';
  const p = PAGES[cur-1]; if(!p || p.t!=='img') return;
  for(const l of LINKS){
    if(l.s !== p.n || !/^https?:|^mailto:/i.test(l.u)) continue;
    const a = document.createElement('a');
    a.href = l.u; a.target = '_blank'; a.rel = 'noopener'; a.title = l.u;
    Object.assign(a.style, { left:(l.x-0.3)+'%', top:(l.y-0.8)+'%', width:(l.w+0.6)+'%', height:(l.h+1.6)+'%' });
    a.addEventListener('click', e => e.stopPropagation());
    box.appendChild(a);
  }
}
function go(n, push=true){
  const T = PAGES.length;
  n = Math.max(1, Math.min(T, n|0 || 1)); cur = n;
  const p = PAGES[n-1];
  $('endApps').classList.toggle('show', p.t==='apps');
  $('endAct').classList.toggle('show', p.t==='act');
  img.style.visibility = p.t==='img' ? '' : 'hidden';
  if(p.t==='img'){ img.src = src(p.n); img.alt = `슬라이드 ${n}`; }
  num.value = n; bar.style.width = (n/T*100)+'%';
  const pn = $('pnum'), nm = p.t==='img' ? NUMS[p.n] : null;
  if(nm){ pn.style.display='flex'; pn.style.background=nm.bg; pn.style.color=nm.fg; pn.textContent=n; } else pn.style.display='none';
  renderLinks();
  if(push) history.replaceState(null,'','#'+n);
  preload(PAGES[n]); preload(PAGES[n+1]); preload(PAGES[n-2]);
  grid.querySelectorAll('figure.current').forEach(f=>f.classList.remove('current'));
  grid.children[n-1]?.classList.add('current');
}
function toggleGrid(open = !grid.classList.contains('open')){
  grid.classList.toggle('open', open);
  if(open) grid.children[cur-1]?.scrollIntoView({block:'center'});
}
function fullscreen(){ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.(); }
$('prev').onclick=()=>go(cur-1); $('next').onclick=()=>go(cur+1);
$('frame').addEventListener('click', e => {
  if(e.target.closest('a')) return;
  const fx = e.clientX / window.innerWidth;
  if(fx < 0.3) go(cur-1); else if(fx > 0.7) go(cur+1);
});
document.querySelector('.nav-zone.left').onclick=()=>go(cur-1);
document.querySelector('.nav-zone.right').onclick=()=>go(cur+1);
$('gridBtn').onclick=()=>toggleGrid(); $('fsBtn').onclick=fullscreen;
$('progress').onclick=e=>{ const r=e.currentTarget.getBoundingClientRect(); go(Math.ceil((e.clientX-r.left)/r.width*PAGES.length)); };
num.onchange=()=>{ go(parseInt(num.value)); num.blur(); };
document.addEventListener('keydown',e=>{
  if(e.target===num) return;
  const k=e.key;
  if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(k)){ e.preventDefault(); go(cur+1); }
  else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(k)){ e.preventDefault(); go(cur-1); }
  else if(k==='Home') go(1); else if(k==='End') go(PAGES.length);
  else if(k==='g'||k==='G') toggleGrid(); else if(k==='f'||k==='F') fullscreen();
  else if(k==='Escape') toggleGrid(false);
});
let sx=null, sy=0;
$('stage').addEventListener('touchstart',e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; },{passive:true});
$('stage').addEventListener('touchend',e=>{
  if(sx===null) return; const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy; sx=null;
  if(Math.abs(dx)>40 && Math.abs(dx)>Math.abs(dy)) go(cur+(dx<0?1:-1));
});
window.addEventListener('hashchange',()=>go(parseInt(location.hash.slice(1)),false));

async function start(){
  try { const r = await fetch('content.json?t='+Date.now(), {cache:'no-store'}); if(r.ok) C = Object.assign({}, DEFAULT_CONTENT, await r.json()); } catch(e) {}
  try { const r = await fetch('links.json'); if(r.ok) LINKS = await r.json(); } catch(e) {}
  try { const r = await fetch('numbers.json'); if(r.ok) NUMS = await r.json(); } catch(e) {}
  buildPages(); renderEnd(); renderGrid();
  go(parseInt(location.hash.slice(1)) || 1, false);
}
window.addEventListener('load', start);   // QR 라이브러리까지 불러온 뒤 시작
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</body>
</html>
